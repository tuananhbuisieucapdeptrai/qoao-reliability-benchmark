[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "qaoa-reliability"
version = "0.1.0.dev0"
description = "Reproducible benchmarks for QAOA optimization reliability."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "QAOA Reliability Benchmark contributors" },
]
dependencies = [
  # Seeded generator output is part of the benchmark's persisted data contract.
  # NetworkX 3.7 changed stochastic_block_model output for the same integer seed.
  "networkx==3.4.2",
  "numpy>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
]
qiskit = [
  "qiskit>=2,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
